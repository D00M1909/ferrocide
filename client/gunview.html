<!doctype html>
<html><body style="margin:0;background:#556">
<canvas id="c" width="1400" height="700"></canvas>
<script type="module">
// dev: side views of a viewmodel gun (?m=shotgun_b)
import * as THREE from 'three';
import { loadAssets, staticModel } from './src/engine/assets';
await loadAssets(() => {});
const name = new URLSearchParams(location.search).get('m') || 'shotgun_b';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setClearColor(0x556677); r.setScissorTest(true);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
const m = staticModel(name, 1); scene.add(m);
scene.add(new THREE.AxesHelper(0.6));
[[new THREE.Vector3(1.3, 0, 0), 0, 0, 700], [new THREE.Vector3(-1.3, 0, 0), 700, 0, 700]].forEach(([pos, x, y, w]) => {
  const cam = new THREE.PerspectiveCamera(30, w / 700, 0.01, 10); cam.position.copy(pos); cam.lookAt(0, 0, 0);
  r.setViewport(x, y, w, 700); r.setScissor(x, y, w, 700); r.render(scene, cam);
});
window.__done = true;
</script></body></html>
